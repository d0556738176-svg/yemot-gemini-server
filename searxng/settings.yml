use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave
      - mojeek
      - qwant
      - startpage
      - wikipedia
      - wikidata
      - yahoo
      - presearch
general:
  instance_name: "yemot-search"
search:
  safe_search: 2
  default_lang: "all"
  formats:
    - html
    - json
server:
  # the real value comes from the SEARXNG_SECRET environment variable
  secret_key: "changed-by-env"
  limiter: false
  image_proxy: false
  public_instance: false
outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  pool_connections: 50
