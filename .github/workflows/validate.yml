name: Validate Node application

on:
  push:
    branches: [main, feature/branch4-ace-step-song-generator, feature/tavily-branch1-search, fix/ivr-context-search-speed, feature-search-quality-2026-10-10, feature-search-recovery-2026-10-10, fix/branch1-website-context]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # youtube-dl-exec downloads its binary from GitHub during postinstall.
        # GitHub's unauthenticated API rate limit made CI fail before tests ran.
        # CI validates JS syntax and unit/regression tests, so skip install scripts here.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check youtube-ivr.js
          node --check youtube-transcript.js
          node --check youtube-authorized-playback.js
          node --check song-generator.js
          node --check song-generator-hf-space.js
          node --check song-ivr.js
      - name: Run regression tests
        run: npm test
      - name: Check Tavily SDK initialization (offline)
        run: |
          node --input-type=module -e "import { tavily } from '@tavily/core'; const client = tavily(); if (!client || typeof client.search !== 'function' || typeof client.extract !== 'function' || typeof client.crawl !== 'function') throw new Error('Tavily SDK methods are unavailable'); console.log('Tavily SDK initialization passed (offline; no API call made)');"

  live-hf-music-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/branch4-ace-step-song-generator' && contains(github.event.head_commit.message, '[live-hf-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate a real 30-second test audio file through Hugging Face
        run: node song-generator-hf-space-live.js

  inspect-hf-space:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/branch4-ace-step-song-generator' && contains(github.event.head_commit.message, '[inspect-hf-space]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public Gradio API schema without generating audio
        run: node song-generator-hf-space-inspect.js
