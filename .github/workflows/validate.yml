name: Validate Node application

on:
  push:
    branches: [feature/tavily-branch1-search]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check youtube-ivr.js
          node --check youtube-transcript.js
          node --check youtube-authorized-playback.js
