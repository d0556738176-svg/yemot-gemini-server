name: Validate Node application

on:
  push:
    branches: [feature/tavily-branch1-search, fix/ivr-context-search-speed, feature-search-quality-2026-10-10, feature-search-recovery-2026-10-10]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check youtube-ivr.js
          node --check youtube-transcript.js
          node --check youtube-authorized-playback.js
      - name: Run regression tests
        run: npm test
      - name: Optional Tavily keyless smoke test
        continue-on-error: true
        run: |
          node --input-type=module -e "import { tavily } from '@tavily/core'; const r = await tavily().search('OpenAI official website', { maxResults: 1, timeout: 5 }); if (!Array.isArray(r.results) || r.results.length < 1) throw new Error('Tavily returned no search results'); console.log('Tavily keyless smoke test passed:', r.results.length, 'result(s)');"
