name: Branch 1 provider fallback checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check provider fallback syntax
        run: node --check provider-fallback.js
      - name: Install ffmpeg for audio tests
        run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
      - name: Run test suite
        env:
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: npm test
