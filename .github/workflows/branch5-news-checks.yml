name: Branch 5 isolated news checks
on:
  push:
    branches: [feature/branch5-news-free-only]
  pull_request:
    paths: ['branch5-news/**', '.github/workflows/branch5-news-checks.yml']
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test branch5-news/core.test.mjs
      - run: node --check branch5-news/app.mjs && bash -n branch5-news/install.sh && bash -n branch5-news/limited-ytdlp.sh
