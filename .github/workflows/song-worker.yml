# Extension 4 song worker: generates ONE song with the official ACE-Step 1.5
# model on a free GitHub runner (CPU) and posts the mp3 back to the phone
# server. Started by the server through workflow_dispatch; never by hand.
name: Extension 4 song worker
run-name: song ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      callback_url: { required: true, type: string }
      ticket: { required: true, type: string }
      payload: { required: true, type: string }
permissions:
  contents: read
jobs:
  song:
    # 15.11: ubuntu-latest ran out of disk mid-song; 24.04 with swap sized to
    # the free disk is what made the first full song.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ACESTEP_REF: ca1e85fe9430179831e6bc6be790c332190a3866
      UV_CACHE_DIR: /mnt/uvcache
    steps:
      - name: Mask ticket
        env:
          WORKER_TICKET: ${{ inputs.ticket }}
        run: echo "::add-mask::$WORKER_TICKET"
      - name: Free disk and add swap
        run: |
          # 24.11: deleting these took 10-26 minutes on newer runner images and
          # held up every song; it now runs in the background while the model
          # is restored and installed (the space is only needed later).
          (sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup > /dev/null 2>&1 &)
          sudo swapoff -a || true
          df -h / /mnt; SW=$(( $(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9) - 25 )); [ $SW -gt 16 ] && SW=16; [ $SW -lt 4 ] && SW=4; sudo fallocate -l ${SW}G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile > /dev/null && sudo swapon /mnt/swapfile
          command -v ffmpeg > /dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null; }
          sudo mkdir -p /mnt/uvcache && sudo chown "$USER" /mnt/uvcache
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy/song-worker }
      - name: Worker regression tests
        run: python3 -m unittest discover -s deploy/song-worker -p 'test_*.py' -v
      - uses: actions/checkout@v4
        with: { repository: ace-step/ACE-Step-1.5, ref: '${{ env.ACESTEP_REF }}', path: ace }
      - uses: astral-sh/setup-uv@v5
        with:
          # uv's post-job prune failed after successful audio delivery.
          # Only the model checkpoints below need a persistent cache.
          enable-cache: false
          prune-cache: false
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ace/checkpoints
          key: acestep15-turbo-checkpoints-v1
      - name: Install ACE-Step
        run: cd ace && UV_CACHE_DIR=/mnt/uvcache uv sync --frozen --python 3.11 > /tmp/install.log 2>&1 || (tail -40 /tmp/install.log; exit 1)
      - name: Generate and deliver
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          TICKET: ${{ inputs.ticket }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          export ACESTEP_API_KEY="$(openssl rand -hex 16)"
          # 24.11: runs lost contact with GitHub ("runner starved for CPU/memory").
          # The model now leaves one core free and runs at low priority, so the
          # runner itself always keeps working.
          CORES=$(nproc); THREADS=$(( CORES > 2 ? CORES - 1 : 1 ))
          (cd ace && OMP_NUM_THREADS=$THREADS MKL_NUM_THREADS=$THREADS TORCH_NUM_THREADS=$THREADS ACESTEP_GENERATION_TIMEOUT=3600 ACESTEP_CONFIG_PATH=acestep-v15-turbo ACESTEP_INIT_LLM=false nohup nice -n 10 .venv/bin/acestep-api --host 127.0.0.1 --port 8001 > /tmp/server.log 2>&1 &)
          python3 deploy/song-worker/worker.py || { tail -n 60 /tmp/server.log | grep -v query_result; exit 1; }

