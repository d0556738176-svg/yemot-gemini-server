# Extension 4 song worker: generates ONE song with the official ACE-Step 1.5
# model on a free GitHub runner (CPU) and posts the mp3 back to the phone
# server. Started by the server through workflow_dispatch; never by hand.
name: Extension 4 song worker
run-name: song ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id: { required: true, type: string }
      callback_url: { required: true, type: string }
      ticket: { required: true, type: string }
      payload: { required: true, type: string }
permissions:
  contents: read
jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ACESTEP_REF: main
    steps:
      - name: Mask ticket
        run: echo "::add-mask::${{ inputs.ticket }}"
      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          sudo swapoff -a || true
          sudo fallocate -l 20G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile > /dev/null && sudo swapon /mnt/swapfile
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          sudo mkdir -p /mnt/uvcache && sudo chown "$USER" /mnt/uvcache
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy/song-worker }
      - uses: actions/checkout@v4
        with: { repository: ace-step/ACE-Step-1.5, ref: '${{ env.ACESTEP_REF }}', path: ace }
      - uses: astral-sh/setup-uv@v5
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: ace/checkpoints
          key: acestep15-turbo-checkpoints-v1
      - name: Install ACE-Step
        run: cd ace && UV_CACHE_DIR=/mnt/uvcache uv sync --python 3.11 > /tmp/install.log 2>&1 || (tail -40 /tmp/install.log; exit 1)
      - name: Generate and deliver
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          TICKET: ${{ inputs.ticket }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          export ACESTEP_API_KEY="$(openssl rand -hex 16)"
          (cd ace && ACESTEP_GENERATION_TIMEOUT=3600 ACESTEP_CONFIG_PATH=acestep-v15-turbo ACESTEP_INIT_LLM=false nohup uv run acestep-api --host 127.0.0.1 --port 8001 > /tmp/server.log 2>&1 &)
          python3 deploy/song-worker/worker.py || { tail -n 60 /tmp/server.log | grep -v query_result; exit 1; }
