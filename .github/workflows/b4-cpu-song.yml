# Extension 4, fully free engine experiment: run the official ACE-Step 1.5 API
# on a GitHub Actions CPU runner (no GPU, no card, no external account) and
# generate one Hebrew song. Measures how long a song takes on CPU.
name: Branch 4 - ACE-Step on GitHub CPU
on:
  workflow_dispatch:
  push:
    branches: [fix/branch4-engine-test]
    paths: ['.github/workflows/b4-cpu-song.yml', 'deploy/cpu-song/**']
permissions:
  contents: write
concurrency: { group: b4-cpu-song, cancel-in-progress: false }
jobs:
  song:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SMOKE_THINKING: 'false'
      SMOKE_DURATION: '40'
      SMOKE_GEN_TIMEOUT: '4000'
    steps:
      - name: Free runner disk (toolchains we do not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / /mnt
      - name: Add 20GB swap (CPU inference holds the full model in RAM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 20G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -g
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: ace-step/ACE-Step-1.5, path: ace }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: ace/checkpoints
          key: acestep15-ckpt-turbo-v1
      - name: Install
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          mkdir -p out
          T0=$(date +%s)
          sudo mkdir -p /mnt/uvcache && sudo chown "$USER" /mnt/uvcache
          cd ace && UV_CACHE_DIR=/mnt/uvcache uv sync --python 3.11 > ../out/install.log 2>&1 || (tail -40 ../out/install.log; exit 1)
          df -h / >> ../out/timing.txt
          echo "install_seconds=$(( $(date +%s) - T0 ))" >> ../out/timing.txt
      - name: Start ACE-Step API on CPU and generate
        run: |
          export ACESTEP_API_KEY="$(openssl rand -hex 16)"
          cd ace
          ACESTEP_CONFIG_PATH=acestep-v15-turbo ACESTEP_INIT_LLM=false ACESTEP_OFFLOAD_TO_CPU=false \
            nohup uv run acestep-api --host 127.0.0.1 --port 8001 > ../out/server.log 2>&1 &
          cd ..
          # Push progress every 2 minutes so a killed runner still leaves evidence.
          ( while true; do sleep 120; d=$(mktemp -d); cp out/*.json "$d"/ 2>/dev/null; tail -n 80 out/server.log > "$d/server-tail.log" 2>/dev/null; free -m > "$d/mem.txt"; uptime >> "$d/mem.txt";
              (cd "$d" && git init -q && git config user.name b4-bot && git config user.email b4-bot@users.noreply.github.com && git checkout -q -b b4-cpu-progress && git add -A && git commit -q -m progress && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" b4-cpu-progress) || true; rm -rf "$d"; done ) &
          python3 deploy/ace-step-modal/smoke_test.py http://127.0.0.1:8001 out || true
          nproc >> out/timing.txt; free -g >> out/timing.txt
      - if: always()
        run: |
          mkdir -p out; cd out
          [ -f server.log ] && tail -n 120 server.log > server-tail.log; rm -f server.log
          [ -f install.log ] && tail -n 30 install.log > install-tail.log; rm -f install.log
          git init -q && git config user.name b4-bot && git config user.email b4-bot@users.noreply.github.com
          git checkout -q -b b4-cpu-results && git add -A && git commit -q -m "cpu ${{ github.run_id }}" --allow-empty
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" b4-cpu-results
