name: ext2 live check
on:
  push:
    branches: [verify/ext2-live]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node verify/ext2-live.mjs
        env:
          WANT_COMMIT: cf50c45
