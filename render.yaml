services:
  - type: web
    name: ai-phone-line
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEYS
        sync: false
      - key: YEMOT_API_USERNAME
        sync: false
      - key: YEMOT_API_PASSWORD
        sync: false
      - key: YEMOT_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DASHBOARD_ACCESS_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGION_CODE
        value: IL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      - key: ENABLE_BRANCH4
        value: "false"
      - key: ACESTEP_API_URL
        sync: false
      - key: ACESTEP_API_KEY
        sync: false
      - key: ACESTEP_MODEL
        value: acestep-v15-turbo
      - key: SONG_GENERATION_TIMEOUT_MS
        value: "180000"
      - key: SONG_WAIT_PROMPT_TIMEOUT_MS
        value: "15000"
      - key: SONG_MAX_CONCURRENT
        value: "1"
      - key: SONG_MAX_QUEUE
        value: "2"
      - key: SONG_MAX_PER_HOUR
        value: "2"
      - key: MUSIC_BACKUP_API_URL
        sync: false
      - key: MUSIC_BACKUP_API_KEY
        sync: false
      - key: MUSIC_BACKUP_MODEL
        sync: false
