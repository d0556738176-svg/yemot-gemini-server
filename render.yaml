services:
  - type: web
    name: ai-phone-line
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEYS
        sync: false
      - key: YEMOT_API_USERNAME
        sync: false
      - key: YEMOT_API_PASSWORD
        sync: false
      - key: YEMOT_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DASHBOARD_ACCESS_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_BACKUP_API_KEY
        sync: false
      - key: LANGSEARCH_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: CRAWL4AI_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGION_CODE
        value: IL
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
