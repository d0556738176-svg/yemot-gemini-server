<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח מחוונים — AI Phone Line</title>
<link rel="stylesheet" href="/dashboard/style.css">
</head>
<body>
<header><h1>AI Phone Line</h1><span id="status">בודק מצב...</span></header>
<main>
<section class="card">
<h2>חיבור</h2>
<label>מפתח Dashboard <input id="token" type="password" autocomplete="off"></label>
<button id="save">שמור</button>
<button id="refresh">רענן</button>
<pre id="health"></pre>
</section>
<section class="card">
<h2>שיחות פעילות</h2><div id="active">אין נתונים</div>
</section>
<section class="card">
<h2>היסטוריית שיחות</h2><div id="calls">אין נתונים</div>
</section>
<section class="card">
<h2>YouTube</h2>
<div class="row"><input id="ytq" placeholder="חיפוש YouTube"><button id="yt">חפש</button></div>
<div id="ytresults"></div>
</section>
</main>
<script src="/dashboard/app.js" defer></script>
</body>
</html>
